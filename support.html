<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Splits Support</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="Need help with Splits? Send us a message. We usually reply within a day." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://trysplits.com/support" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
<meta name="theme-color" content="#F5F4EF" />


<style>
:root {
  --green: #267A4D;
  --green-dark: #1B6B3A;
  --green-50: #E8F5EC;
  --bg: #F5F4EF;
  --surface: #FFFFFF;
  --border: #E6E4DB;
  --text: #1A1A2E;
  --t2: #6B6A62;
  --t3: #6B6A62;
  --error: #C4473A;
  --container: 760px;
  --radius-btn: 10px;
  --radius-input: 8px;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px; line-height: 1.7;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--green); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font-family: inherit; cursor: pointer; }

.nav {
  position: sticky; top: 0; z-index: 50;
  height: 64px;
  background: #F5F4EF;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 0.5px solid var(--border);
}
.nav-inner {
  height: 100%; display: flex; align-items: center; justify-content: space-between;
  max-width: 1140px; margin: 0 auto; padding: 0 24px;
}
.container { max-width: var(--container); margin: 0 auto; padding: 0 24px; }
.lockup { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
.legal .updated { font-size: 14px; color: var(--t3); margin: 0 0 48px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 8px; height: 48px; padding: 0 22px;
  border-radius: var(--radius-btn);
  font-size: 15px; font-weight: 600; letter-spacing: -0.1px;
  border: none; cursor: pointer; white-space: nowrap;
  transition: background 160ms ease, transform 160ms ease, color 160ms ease, box-shadow 160ms ease;
}
.btn-primary { background: var(--green); color: #fff; box-shadow: none; }
.btn-primary:hover { background: var(--green-dark); transform: translateY(-1px); box-shadow: none; }
.btn-primary:disabled {
  opacity: 0.7; cursor: not-allowed; transform: none;
  box-shadow: none;
}

.waitlist-form-group {
  max-width: 460px;
  margin-bottom: 24px;
}
.support-form {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.support-form label {
  display: block;
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 8px;
}
.support-form input[type="email"],
.support-form textarea {
  width: 100%;
  padding: 0 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius-input);
  background: var(--surface);
  font-family: inherit; font-size: 15px; color: var(--text);
  outline: none;
  transition: border-color 160ms ease, box-shadow 160ms ease;
}
.support-form input[type="email"] { height: 48px; }
.support-form textarea {
  padding: 12px 16px;
  min-height: 120px;
  resize: vertical;
  line-height: 1.5;
}
.support-form input[type="email"]:focus,
.support-form textarea:focus {
  border-color: var(--green);
  box-shadow: 0 0 0 3px rgba(38, 122, 77, 0.16);
}
.support-form input.invalid,
.support-form textarea.invalid { border-color: var(--error); }
.support-form input.invalid:focus,
.support-form textarea.invalid:focus {
  border-color: var(--error);
  box-shadow: 0 0 0 3px rgba(196, 71, 58, 0.16);
}
.support-form .btn { align-self: flex-start; }
.waitlist-error {
  display: none;
  margin-top: 8px;
  font-size: 14px;
  color: var(--error);
}
.legal .waitlist-error { color: var(--error); margin: 8px 0 0; }
.waitlist-error.show { display: block; }
.waitlist-success {
  display: none;
  height: 48px; padding: 0 20px;
  border-radius: var(--radius-input);
  background: var(--green-50);
  color: var(--green-dark);
  font-weight: 500; font-size: 15px;
  align-items: center; gap: 8px;
  max-width: 460px;
}
.waitlist-success.show { display: inline-flex; }
.waitlist-form-group.hidden,
.waitlist-form.hidden { display: none; }

.footer {
  border-top: 1px solid var(--border);
  padding: 32px 0; text-align: center;
  font-size: 13px; color: var(--t3);
}
.footer a { color: var(--t3); }
.footer a:hover { color: var(--green); }

@media (max-width: 768px) {
  .nav-inner { padding: 0 16px; }
  .container { padding: 0 16px; }
  .support-form .btn { width: 100%; }
  .waitlist-form-group,
  .waitlist-success { max-width: 100%; width: 100%; }
}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="lockup" aria-label="Splits home"><img src="/splits-wordmark.svg" alt="splits" height="26" style="display:block;height:26px;width:auto"></a>
    <a href="/" style="font-size:14px;font-weight:500;color:var(--t2);">&larr; Back to home</a>
  </div>
</nav>

<main class="container">
  <article class="legal">
    <h1>Need help?</h1>
    <p class="updated">We usually reply within a day.</p>

    <div class="waitlist-form-group" id="support-form-group">
      <form class="support-form" id="support-form" novalidate>
        <div>
          <label for="support-email">Email</label>
          <input type="email" name="email" id="support-email" placeholder="Enter your email" autocomplete="email" aria-describedby="support-form-error" required />
        </div>
        <div>
          <label for="support-message">Message</label>
          <textarea name="message" id="support-message" rows="5" maxlength="2000" placeholder="How can we help?" aria-describedby="support-form-error" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send message</button>
      </form>
      <p class="waitlist-error" id="support-form-error" role="alert">Please enter a valid email address.</p>
    </div>
    <div class="waitlist-success" id="support-success" role="status">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M4 9.5l3.2 3L14 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Thanks. We'll get back to you soon.
    </div>
  </article>
</main>

<footer class="footer">
  <div class="container">
    &copy; 2026 Splits &middot; <a href="/privacy">Privacy</a> &middot; <a href="/terms">Terms</a> &middot; <a href="/support">Support</a>
  </div>
</footer>

<script>
(function () {
  const WORKER_URL = 'https://splits-waitlist.antonio-d78.workers.dev/api/support';
  const MAX_MESSAGE = 2000;
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  const form = document.getElementById('support-form');
  const success = document.getElementById('support-success');
  const error = document.getElementById('support-form-error');
  const emailInput = document.getElementById('support-email');
  const messageInput = document.getElementById('support-message');
  const btn = form.querySelector('button[type="submit"]');
  const group = document.getElementById('support-form-group');

  const clearError = () => {
    emailInput.classList.remove('invalid');
    messageInput.classList.remove('invalid');
    emailInput.removeAttribute('aria-invalid');
    messageInput.removeAttribute('aria-invalid');
    error.classList.remove('show');
  };

  const showError = (msg, field) => {
    error.textContent = msg;
    emailInput.classList.remove('invalid');
    messageInput.classList.remove('invalid');
    emailInput.removeAttribute('aria-invalid');
    messageInput.removeAttribute('aria-invalid');
    if (field) {
      field.classList.add('invalid');
      field.setAttribute('aria-invalid', 'true');
      field.focus();
    }
    error.classList.add('show');
  };

  async function submitSupport(email, message) {
    try {
      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, message }),
      });
      return res.ok;
    } catch (e) {
      console.error('Submission error:', e);
      return false;
    }
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = (emailInput.value || '').trim();
    const message = (messageInput.value || '').trim();

    if (!EMAIL_RE.test(email)) {
      showError('Please enter a valid email address.', emailInput);
      return;
    }
    if (!message) {
      showError('Please enter a message.', messageInput);
      return;
    }
    if (message.length > MAX_MESSAGE) {
      showError('Message is too long (max 2000 characters).', messageInput);
      return;
    }

    clearError();
    btn.disabled = true;
    btn.textContent = 'Sending…';

    const ok = await submitSupport(email, message);
    if (ok) {
      group.classList.add('hidden');
      success.classList.add('show');
    } else {
      showError('Something went wrong. Please try again.');
      btn.disabled = false;
      btn.textContent = 'Send message';
    }
  });

  emailInput.addEventListener('input', clearError);
  messageInput.addEventListener('input', clearError);
})();
</script>

</body>
</html>
